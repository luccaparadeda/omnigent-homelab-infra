name: Bug report
description: Report reproducible behavior that is not security-sensitive.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Never include credentials, account identifiers, state, or private logs.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, with sensitive values removed?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private addresses, OCIDs, state, and personal data.
          required: true
