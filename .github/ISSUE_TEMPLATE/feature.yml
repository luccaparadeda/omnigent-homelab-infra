name: Feature request
description: Propose a scoped improvement to the infrastructure or documentation.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which concrete problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and cost impact
      description: Describe new trust boundaries, privileges, public exposure, or paid resources.
    validations:
      required: true
