---
- name: Read control-plane Tailscale IP
  ansible.builtin.command: tailscale ip -4
  register: control_tailscale_ip
  changed_when: false
  failed_when: false
  when: omnigent_bind_ip | length == 0

- name: Select private bind IP
  ansible.builtin.set_fact:
    control_private_ip: >-
      {{ omnigent_bind_ip if omnigent_bind_ip | length > 0 else (control_tailscale_ip.stdout | trim) }}

- name: Require deployment secrets only when starting services
  ansible.builtin.assert:
    that:
      - control_private_ip | length > 0
      - omnigent_base_url | length > 0
      - omnigent_base_url is match('^https://')
      - omnigent_database_url | length > 0 or omnigent_postgres_password | length >= 24
      - omnigent_accounts_cookie_secret | length >= 32
      - omnigent_accounts_cookie_secret is match('^[A-Za-z0-9._~-]+$')
      - omnigent_accounts_init_admin_password | length >= 16
      - omnigent_accounts_init_admin_password is match('^[A-Za-z0-9._~-]+$')
      - omnigent_vault_addr | length > 0
      - omnigent_vault_proxy_role | length > 0
      - omnigent_vault_proxy_auth_mount == 'auth/approle' or omnigent_vault_ca_src | length > 0
      - omnigent_vault_proxy_auth_mount != 'auth/approle' or omnigent_vault_role_id_src | length > 0
      - omnigent_vault_proxy_auth_mount != 'auth/approle' or omnigent_vault_secret_id_src | length > 0
    fail_msg: "Private networking and URL-safe deployment secrets must be supplied before starting Omnigent."
  when: control_plane_start_services | bool
  no_log: true

- name: Create control-plane directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ control_plane_root }}", mode: "0750" }
    - { path: "{{ control_plane_data_root }}/postgres", mode: "0700" }
    - { path: "{{ control_plane_data_root }}/artifacts", mode: "0750", owner: "10001", group: "10001" }
    - { path: "{{ control_plane_data_root }}/admin-credentials", mode: "0700", owner: "10001", group: "10001" }
    - { path: "{{ omnigent_vault_ca_root }}", mode: "0750" }
    - { path: "{{ omnigent_vault_approle_root }}", mode: "0750", owner: "100", group: "1000" }

- name: Inspect the control-plane swap file
  ansible.builtin.stat:
    path: /swapfile
  register: control_plane_swapfile
  when: control_plane_swap_size_mb | int > 0

- name: Allocate the low-memory control-plane swap file
  ansible.builtin.command:
    cmd: "fallocate -l {{ control_plane_swap_size_mb }}M /swapfile"
  when:
    - control_plane_swap_size_mb | int > 0
    - not control_plane_swapfile.stat.exists
  changed_when: true

- name: Protect the control-plane swap file
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"
  when: control_plane_swap_size_mb | int > 0

- name: Format the new control-plane swap file
  ansible.builtin.command: mkswap /swapfile
  when:
    - control_plane_swap_size_mb | int > 0
    - not control_plane_swapfile.stat.exists
  changed_when: true

- name: Persist the control-plane swap file
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    regexp: '^/swapfile\s'
    state: present
  when: control_plane_swap_size_mb | int > 0

- name: Read active control-plane swap devices
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: control_plane_active_swap
  changed_when: false
  when: control_plane_swap_size_mb | int > 0

- name: Enable the control-plane swap file
  ansible.builtin.command: swapon /swapfile
  when:
    - control_plane_swap_size_mb | int > 0
    - "'/swapfile' not in control_plane_active_swap.stdout_lines"
  changed_when: true

- name: Keep low-memory swapping conservative
  ansible.builtin.copy:
    dest: /etc/sysctl.d/61-omnigent-control-memory.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      vm.swappiness = 10
  when: control_plane_swap_size_mb | int > 0
  notify: Reload control-plane sysctl

- name: Install backup tooling
  ansible.builtin.apt:
    name:
      - "age={{ age_apt_version }}"
      - "pipx={{ pipx_apt_version }}"
    state: present
  when: omnigent_backup_enabled | bool

- name: Read installed OCI CLI version
  ansible.builtin.command: /usr/local/bin/oci --version
  register: installed_oci_cli
  changed_when: false
  failed_when: false
  when: omnigent_backup_enabled | bool

- name: Install pinned OCI CLI for instance-principal backup uploads
  ansible.builtin.command:
    cmd: "pipx install --force oci-cli=={{ oci_cli_version }}"
  changed_when: true
  environment:
    PIPX_HOME: /opt/oci-cli-pipx
    PIPX_BIN_DIR: /usr/local/bin
  when:
    - omnigent_backup_enabled | bool
    - oci_cli_version not in installed_oci_cli.stdout

- name: Install Vault CA certificate for the Omnigent client
  ansible.builtin.copy:
    src: "{{ omnigent_vault_ca_src }}"
    dest: "{{ omnigent_vault_ca_root }}/ca.crt"
    owner: root
    group: root
    mode: "0644"
  when:
    - control_plane_start_services | bool
    - omnigent_vault_proxy_auth_mount != 'auth/approle'
  notify: Restart control plane

- name: Install the Vault AppRole identity for the local proxy
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "100"
    group: "1000"
    mode: "0400"
  loop:
    - { src: "{{ omnigent_vault_role_id_src }}", dest: "{{ omnigent_vault_approle_root }}/role-id" }
    - { src: "{{ omnigent_vault_secret_id_src }}", dest: "{{ omnigent_vault_approle_root }}/secret-id" }
  when:
    - control_plane_start_services | bool
    - omnigent_vault_proxy_auth_mount == 'auth/approle'
  notify: Restart control plane
  no_log: true

- name: Install reviewed control-plane Compose definition
  ansible.builtin.copy:
    src: "{{ control_plane_compose_src }}"
    dest: "{{ control_plane_root }}/compose.yaml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart control plane

- name: Install Vault-enabled Omnigent image definition
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0640"
  loop:
    - { src: "{{ playbook_dir }}/../../compose/control-plane/Dockerfile", dest: "{{ control_plane_root }}/Dockerfile" }
    - { src: "{{ playbook_dir }}/../../compose/control-plane/requirements-vault.txt", dest: "{{ control_plane_root }}/requirements-vault.txt" }
    - { src: "{{ playbook_dir }}/../../compose/control-plane/.dockerignore", dest: "{{ control_plane_root }}/.dockerignore" }
  notify: Restart control plane

- name: Install Vault Proxy configuration
  ansible.builtin.template:
    src: "{{ control_plane_vault_proxy_template }}"
    dest: "{{ control_plane_root }}/vault-proxy.hcl"
    owner: root
    group: root
    mode: "0644"
  notify: Restart control plane

- name: Render secret control-plane environment
  ansible.builtin.template:
    src: "{{ control_plane_env_template }}"
    dest: "{{ control_plane_root }}/.env"
    owner: root
    group: root
    mode: "0600"
  notify: Restart control plane
  no_log: true
  when: control_plane_start_services | bool

- name: Start control-plane services after explicit enablement
  ansible.builtin.command:
    cmd: docker compose up -d --build --remove-orphans
    chdir: "{{ control_plane_root }}"
  register: control_compose_up
  changed_when: "'Started' in control_compose_up.stdout or 'Created' in control_compose_up.stdout"
  when: control_plane_start_services | bool

- name: Read existing Tailscale Serve configuration
  ansible.builtin.command: tailscale serve status --json
  register: omnigent_tailscale_serve_status
  changed_when: false
  failed_when: false
  when:
    - control_plane_start_services | bool

- name: Reset stale or disabled Tailscale Serve configuration
  ansible.builtin.command: tailscale serve reset
  changed_when: true
  when:
    - control_plane_start_services | bool
    - omnigent_tailscale_serve_status.rc == 0
    - omnigent_tailscale_serve_status.stdout | trim not in ['', '{}']
    - not (omnigent_tailscale_serve_enabled | bool) or omnigent_tailscale_serve_target not in omnigent_tailscale_serve_status.stdout

- name: Publish Omnigent through private Tailscale HTTPS
  ansible.builtin.command:
    cmd: "tailscale serve --bg {{ omnigent_tailscale_serve_target }}"
  changed_when: true
  when:
    - control_plane_start_services | bool
    - omnigent_tailscale_serve_enabled | bool
    - omnigent_tailscale_serve_target not in omnigent_tailscale_serve_status.stdout

- name: Validate optional encrypted backup settings
  ansible.builtin.assert:
    that:
      - omnigent_backup_bucket | length > 0
      - omnigent_backup_age_recipient | length > 0
    fail_msg: "A bucket name and age public recipient are required when backups are enabled."
  when: omnigent_backup_enabled | bool

- name: Install encrypted logical-backup script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/backup-control-plane.sh"
    dest: /usr/local/sbin/omnigent-backup
    owner: root
    group: root
    mode: "0750"

- name: Install backup systemd service
  ansible.builtin.template:
    src: backup.service.j2
    dest: /etc/systemd/system/omnigent-backup.service
    owner: root
    group: root
    mode: "0644"
  when: omnigent_backup_enabled | bool
  notify: Reload systemd

- name: Install backup systemd timer
  ansible.builtin.template:
    src: backup.timer.j2
    dest: /etc/systemd/system/omnigent-backup.timer
    owner: root
    group: root
    mode: "0644"
  when: omnigent_backup_enabled | bool
  notify: Reload systemd

- name: Enable encrypted backup timer
  ansible.builtin.systemd_service:
    name: omnigent-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  when: omnigent_backup_enabled | bool

- name: Check for a previously installed backup timer
  ansible.builtin.stat:
    path: /etc/systemd/system/omnigent-backup.timer
  register: omnigent_backup_timer_unit
  when: not (omnigent_backup_enabled | bool)

- name: Disable a previously installed backup timer
  ansible.builtin.systemd_service:
    name: omnigent-backup.timer
    enabled: false
    state: stopped
    daemon_reload: true
  when:
    - not (omnigent_backup_enabled | bool)
    - omnigent_backup_timer_unit.stat.exists

- name: Remove disabled backup unit files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/omnigent-backup.timer
    - /etc/systemd/system/omnigent-backup.service
  when:
    - not (omnigent_backup_enabled | bool)
    - omnigent_backup_timer_unit.stat.exists
  notify: Reload systemd
