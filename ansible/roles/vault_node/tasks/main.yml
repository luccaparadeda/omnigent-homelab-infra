---
- name: Read Vault Tailscale IP
  ansible.builtin.command: tailscale ip -4
  register: vault_tailscale_ip
  changed_when: false
  failed_when: false
  when: vault_bind_ip | length == 0

- name: Select Vault private bind IP
  ansible.builtin.set_fact:
    vault_private_ip: >-
      {{ vault_bind_ip if vault_bind_ip | length > 0 else (vault_tailscale_ip.stdout | trim) }}

- name: Check for active swap on the dedicated Vault node
  ansible.builtin.command: swapon --show --noheadings
  register: vault_active_swap
  changed_when: false

- name: Refuse to start Vault while swap is active
  ansible.builtin.assert:
    that:
      - vault_active_swap.stdout | trim | length == 0
    fail_msg: >-
      Vault requires swap to be disabled. Remove active and persistent swap,
      reboot if needed, and re-run this play before enabling the service.
  when: vault_start_services | bool

- name: Require KMS and TLS inputs only when starting Vault
  ansible.builtin.assert:
    that:
      - vault_private_ip | length > 0
      - vault_api_addr | length > 0
      - vault_cluster_addr | length > 0
      - oci_kms_key_id | length > 0
      - oci_kms_crypto_endpoint | length > 0
      - oci_kms_management_endpoint | length > 0
      - vault_tls_cert_src | length > 0
      - vault_tls_key_src | length > 0
      - vault_tls_ca_src | length > 0
    fail_msg: "Private networking, OCI KMS values, and TLS files are required before Vault can start."
  when: vault_start_services | bool

- name: Create Vault directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ vault_root }}", owner: "root", group: "root", mode: "0750" }
    - { path: "{{ vault_root }}/config", owner: "{{ vault_runtime_uid }}", group: "{{ vault_runtime_gid }}", mode: "0750" }
    - { path: "{{ vault_root }}/policies", owner: "{{ vault_runtime_uid }}", group: "{{ vault_runtime_gid }}", mode: "0750" }
    - { path: "{{ vault_data_root }}/data", owner: "{{ vault_runtime_uid }}", group: "{{ vault_runtime_gid }}", mode: "0700" }
    - { path: "{{ vault_tls_root }}", owner: "{{ vault_runtime_uid }}", group: "{{ vault_runtime_gid }}", mode: "0750" }

- name: Install reviewed Vault Compose definition
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../compose/vault/compose.yaml"
    dest: "{{ vault_root }}/compose.yaml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart Vault

- name: Install Vault runtime configuration and policy
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ vault_runtime_uid }}"
    group: "{{ vault_runtime_gid }}"
    mode: "0640"
  loop:
    - { src: "{{ playbook_dir }}/../../compose/vault/config/vault.hcl", dest: "{{ vault_root }}/config/vault.hcl" }
    - { src: "{{ playbook_dir }}/../../compose/vault/policies/omnigent-transit.hcl", dest: "{{ vault_root }}/policies/omnigent-transit.hcl" }
    - { src: "{{ playbook_dir }}/../../compose/vault/policies/vault-backup.hcl", dest: "{{ vault_root }}/policies/vault-backup.hcl" }
  notify: Restart Vault

- name: Install Vault TLS material
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ vault_runtime_uid }}"
    group: "{{ vault_runtime_gid }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ vault_tls_cert_src }}", dest: "{{ vault_tls_root }}/server.crt", mode: "0644" }
    - { src: "{{ vault_tls_key_src }}", dest: "{{ vault_tls_root }}/server.key", mode: "0600" }
    - { src: "{{ vault_tls_ca_src }}", dest: "{{ vault_tls_root }}/ca.crt", mode: "0644" }
  when: vault_start_services | bool
  notify: Restart Vault
  no_log: true

- name: Render Vault environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ vault_root }}/.env"
    owner: root
    group: root
    mode: "0600"
  notify: Restart Vault

- name: Start Vault only after explicit enablement
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ vault_root }}"
  register: vault_compose_up
  changed_when: "'Started' in vault_compose_up.stdout or 'Created' in vault_compose_up.stdout"
  when: vault_start_services | bool

- name: Validate encrypted Vault snapshot settings
  ansible.builtin.assert:
    that:
      - vault_backup_bucket | length > 0
      - vault_backup_age_recipient | length > 0
      - vault_backup_role | length > 0
    fail_msg: "A bucket, age public recipient, and OCI auth role are required for Vault snapshots."
  when: vault_backup_enabled | bool

- name: Install Vault snapshot dependencies
  ansible.builtin.apt:
    name:
      - "age={{ age_apt_version }}"
      - "pipx={{ pipx_apt_version }}"
    state: present
  when: vault_backup_enabled | bool

- name: Read installed OCI CLI version for Vault snapshots
  ansible.builtin.command: /usr/local/bin/oci --version
  register: vault_installed_oci_cli
  changed_when: false
  failed_when: false
  when: vault_backup_enabled | bool

- name: Install pinned OCI CLI for Vault snapshot uploads
  ansible.builtin.command:
    cmd: "pipx install --force oci-cli=={{ oci_cli_version }}"
  changed_when: true
  environment:
    PIPX_HOME: /opt/oci-cli-pipx
    PIPX_BIN_DIR: /usr/local/bin
  when:
    - vault_backup_enabled | bool
    - oci_cli_version not in vault_installed_oci_cli.stdout

- name: Install encrypted Vault snapshot script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/backup-vault-raft.sh"
    dest: /usr/local/sbin/omnigent-vault-backup
    owner: root
    group: root
    mode: "0750"
  when: vault_backup_enabled | bool

- name: Install Vault snapshot systemd service
  ansible.builtin.template:
    src: backup.service.j2
    dest: /etc/systemd/system/omnigent-vault-backup.service
    owner: root
    group: root
    mode: "0644"
  when: vault_backup_enabled | bool
  notify: Reload systemd

- name: Install Vault snapshot systemd timer
  ansible.builtin.template:
    src: backup.timer.j2
    dest: /etc/systemd/system/omnigent-vault-backup.timer
    owner: root
    group: root
    mode: "0644"
  when: vault_backup_enabled | bool
  notify: Reload systemd

- name: Enable encrypted Vault snapshot timer
  ansible.builtin.systemd_service:
    name: omnigent-vault-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  when: vault_backup_enabled | bool

- name: Check for a previously installed Vault snapshot timer
  ansible.builtin.stat:
    path: /etc/systemd/system/omnigent-vault-backup.timer
  register: vault_backup_timer_unit
  when: not (vault_backup_enabled | bool)

- name: Disable a previously installed Vault snapshot timer
  ansible.builtin.systemd_service:
    name: omnigent-vault-backup.timer
    enabled: false
    state: stopped
    daemon_reload: true
  when:
    - not (vault_backup_enabled | bool)
    - vault_backup_timer_unit.stat.exists

- name: Remove disabled Vault snapshot unit files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/omnigent-vault-backup.timer
    - /etc/systemd/system/omnigent-vault-backup.service
  when:
    - not (vault_backup_enabled | bool)
    - vault_backup_timer_unit.stat.exists
  notify: Reload systemd
