---
omnigent_version: "0.19.1"
omnigent_worker_user: omnigent-worker
omnigent_worker_home: /var/lib/omnigent-worker
omnigent_pipx_home: /opt/omnigent-pipx
omnigent_server_url: ""

# Rootful Docker group membership is root-equivalent and defeats Unix-user and
# keyring isolation. Keep it disabled for subscription-authenticated workers.
omnigent_worker_allow_rootful_docker: false
